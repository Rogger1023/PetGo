<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Painel Administrativo | PetGo</title>

    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/admin/admin.css">

    <script type="module" src="/admin/admin.js"></script>
</head>
<body>
    <header class="admin-header">
        <a href="/" class="admin-brand">🐾 PetGo Admin</a>

        <nav aria-label="Navegação administrativa">
            <a href="/">Ver loja</a>
            <a href="/admin/catalogo.html"> Produtos e categorias </a>
            <a href="/conta.html">Minha conta</a>
        </nav>
    </header>

    <main class="admin-container">
        <div class="admin-heading">
            <div>
                <h1>Painel Administrativo</h1>
                <p>Gerenciamento da loja PetGo</p>
            </div>
        </div>

        <p id="admin-status" role="status" aria-live="polite">
            Verificando acesso...
        </p>

        <section id="admin-dashboard" hidden>
            <div class="admin-summary">
                <div class="admin-card">
                    <h2>Pedidos</h2>
                    <strong id="admin-orders-count">—</strong>
                </div>

                <div class="admin-card">
                    <h2>Gerenciamento</h2>
                    <p>Pedidos e operações administrativas</p>
                </div>
            </div>

            <section class="admin-card">
                <h2>Pedidos recentes</h2>

                <div class="admin-table-wrapper">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Pedido</th>
                                <th>Data</th>
                                <th>Status</th>
                                <th>Total</th>
                                <th>Ação</th>
                            </tr>
                        </thead>

                        <tbody id="admin-orders-body"></tbody>
                    </table>
                </div>
            </section>

            <section id="admin-order-details" class="admin-card" hidden>
                <h2>Detalhes do pedido</h2>
                <div id="admin-order-content"></div>
            </section>
        </section>
    </main>
</body>
</html>

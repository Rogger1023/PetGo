<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meu Carrinho | PetGo</title>

    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/cart.css">
    <link rel="stylesheet" href="/css/checkout-orders.css">

    <script type="module" src="/js/cart.js"></script>
</head>
<body>

    <header id="site-header" class="site-header"></header>

    <main class="cart-page">
        <div class="container">

            <a href="/catalogo.html" class="cart-back-link">
                ← Continuar comprando
            </a>

            <h1>Meu carrinho</h1>

            <p
                id="cart-page-status"
                class="cart-page-status"
                role="status"
                aria-live="polite"
            >
                Carregando carrinho...
            </p>

            <div
                id="cart-page-content"
                class="cart-page-layout"
                hidden
            >
                <section aria-label="Produtos no carrinho">
                    <ul
                        id="cart-page-items"
                        class="cart-page-items"
                    ></ul>
                </section>

                <aside class="cart-page-summary">
                    <h2>Resumo do carrinho</h2>

                    <p id="cart-page-count"></p>

                    <div class="cart-summary-divider"></div>

                    <span>Subtotal estimado</span>

                    <strong id="cart-page-total"></strong>

                    <p class="cart-summary-notice">
                        Frete e valores finais serão
                        calculados no checkout.
                    </p>

                    <a href="/catalogo.html" class="cart-continue-link">
                        Continuar comprando
                    </a>
                    <a href="/checkout.html" class="checkout-action">
                        Finalizar compra
                    </a>
                </aside>
            </div>

        </div>
    </main>

    <footer id="site-footer" class="site-footer"></footer>

</body>
</html>

openapi: 3.0.3

info:
  title: PetGo API
  version: 1.0.0
  description: |
    Documentação da API do PetGo.
    Os endpoints documentados aqui correspondem às rotas atualmente implementadas.

servers:
  - url: /
    description: Mesmo host do frontend, com /api encaminhado pelo Nginx ao Laravel.

tags:
  - name: Saúde
    description: Verificação de disponibilidade da API.
  - name: Produtos
    description: Consulta ao catálogo público.

paths:
  /api/health:
    get:
      tags:
        - Saúde
      summary: Verificar a saúde da API
      operationId: getHealth
      responses:
        '200':
          description: API respondendo normalmente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                app: PetGo
                status: ok

  /api/products:
    get:
      tags:
        - Produtos
      summary: Listar produtos ativos
      description: |
        Retorna produtos ativos ordenados pelo nome, com paginação.
        Os preços são expressos em centavos para evitar ambiguidades com decimais.
      operationId: listProducts
      parameters:
        - name: page
          in: query
          required: false
          description: Número da página desejada.
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        '200':
          description: Lista paginada de produtos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductCollection'
        '500':
          description: Erro interno inesperado do servidor.

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: token
      description: |
        Esquema preparado para futuras rotas protegidas.
        Os endpoints atuais não exigem token.

  responses:
    ValidationError:
      description: Erro de validação para endpoints que recebem dados.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
          example:
            message: Os dados informados são inválidos.
            errors:
              name:
                - O campo nome é obrigatório.
              price_cents:
                - O preço deve ser maior ou igual a zero.

  schemas:
    HealthResponse:
      type: object
      required:
        - app
        - status
      properties:
        app:
          type: string
          example: PetGo
        status:
          type: string
          example: ok

    Product:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Ração para cães
        slug:
          type: string
          example: racao-para-caes
        description:
          type: string
          nullable: true
        image_path:
          type: string
          nullable: true
        price_cents:
          type: integer
          format: int64
          minimum: 0
          example: 12990
        in_stock:
          type: boolean
          description: Indica se há pelo menos uma unidade em estoque.
          example: true
        category:
          allOf:
            - $ref: '#/components/schemas/Category'
          nullable: true

    Category:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        slug:
          type: string
        description:
          type: string
          nullable: true

    ProductCollection:
      type: object
      required:
        - data
        - links
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        links:
          $ref: '#/components/schemas/PaginationLinks'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    PaginationLinks:
      type: object
      properties:
        first:
          type: string
          nullable: true
        last:
          type: string
          nullable: true
        prev:
          type: string
          nullable: true
        next:
          type: string
          nullable: true

    PaginationMeta:
      type: object
      properties:
        current_page:
          type: integer
        from:
          type: integer
          nullable: true
        last_page:
          type: integer
        links:
          type: array
          items:
            type: object
            properties:
              url:
                type: string
                nullable: true
              label:
                type: string
              active:
                type: boolean
        path:
          type: string
        per_page:
          type: integer
        to:
          type: integer
          nullable: true
        total:
          type: integer

    ValidationError:
      type: object
      required:
        - message
        - errors
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <meta name="description"
          content="Explore o catálogo de produtos do PetGo.">

    <title>Catálogo de Produtos | PetGo</title>

    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/product-card.css">
    <link rel="stylesheet" href="/css/catalog.css">

    <script type="module" src="/js/catalog.js"></script>
</head>

<body>

    <header id="site-header" class="site-header"></header>

    <main>
        <section class="catalog-section">
            <div class="container">

                <div class="catalog-heading"> 
                    <form
                        id="catalog-filters"
                        class="catalog-filters"
                        action="/catalogo.html"
                        method="get"
                        role="search"
                    >
                        <div class="catalog-filter-field">
                            <label for="catalog-search">
                                Buscar produto
                            </label>

                            <input
                                type="search"
                                id="catalog-search"
                                name="search"
                                maxlength="100"
                                placeholder="Ex.: ração, shampoo, bola..."
                            >
                        </div>

                        <div class="catalog-filter-field">
                            <label for="catalog-category">
                                Categoria
                            </label>

                            <select
                                id="catalog-category"
                                name="category_id"
                            >
                                <option value="">
                                    Todas as categorias
                                </option>
                            </select>
                        </div>

                        <div class="catalog-filter-actions">
                            <button type="submit" class="catalog-filter-button">
                                Buscar
                            </button>

                            <a href="/catalogo.html" class="catalog-filter-reset">
                                Limpar filtros
                            </a>
                        </div>
                    </form>
                </div>

                <p
                    id="catalog-status"
                    class="catalog-status"
                    role="status"
                    aria-live="polite"
                >
                    Carregando produtos...
                </p>

                <div
                    id="catalog-products"
                    class="products-grid"
                ></div>

                <nav
                    id="catalog-pagination"
                    class="catalog-pagination"
                    aria-label="Paginação do catálogo"
                ></nav>

            </div>
        </section>
    </main>

    <footer id="site-footer" class="site-footer"></footer>

</body>
</html>

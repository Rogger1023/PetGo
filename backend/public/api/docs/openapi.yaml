openapi: 3.0.3
info:
  title: PetGo API
  version: 1.0.0
  description: 'Especificação auditada a partir do código enviado em PetGo.zip (09/11/2026).


    Autenticação real: tokens pessoais do Laravel Sanctum. POST /api/register e POST /api/login retornam {user,
    token}. Copie token para Authorize. Logout revoga somente o token usado. Não há login por sessão implementado
    nem statefulApi() no bootstrap; obter /sanctum/csrf-cookie não autentica. Nenhuma mudança de autenticação foi
    realizada.


    Acesso público: saúde, catálogo, categorias, cadastro/login e criação de carrinho visitante. Demais operações
    de visitante exigem X-Guest-Cart-Token. auth:sanctum permite qualquer usuário autenticado nas rotas comuns;
    propriedade é verificada em consultas/serviços. Rotas administrativas exigem role exatamente admin via middleware;
    não há policies/gates adicionais no código da aplicação.


    Respostas seguem Resources: envelope data quando retornados diretamente; paginação também inclui links/meta.
    Login/cadastro usam {user,token}; GET /api/me usa {user}; criação de visitante usa {cart,guest_cart_token};
    checkout usa {message,order}. Esses objetos internos não recebem envelope data. Valores monetários são centavos
    inteiros. Campos condicionais dos Resources são descritos nos schemas/operações.


    Try it out usa o mesmo host do proxy. servers=/ e paths completos evitam duplicar /api. As operações de escrita
    alteram dados reais. Erros são JSON com Accept: application/json; em modo debug Laravel pode incluir detalhes
    adicionais. Apenas endpoints da API e a rota Sanctum relevante são incluídos; página Laravel /, saúde de framework
    /up e rotas internas de armazenamento não integram o contrato de negócio.'
servers:
- url: /
  description: Mesmo host e porta da documentação; /api é preservado pelo proxy.
tags:
- name: Saúde
- name: Autenticação
- name: Produtos
- name: Categorias
- name: Carrinho visitante
- name: Carrinho autenticado
- name: Endereços
- name: Checkout
- name: Pedidos
- name: Administração de produtos
- name: Administração de categorias
- name: Administração de pedidos
- name: Estoque
- name: Infraestrutura Sanctum
paths:
  /api/health:
    get:
      tags:
      - Saúde
      summary: Consultar saúde da API
      operationId: get_api_health
      description: Público.
      security: []
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  app:
                    type: string
                    enum:
                    - PetGo
                  status:
                    type: string
                    enum:
                    - ok
                required:
                - app
                - status
  /api/register:
    post:
      tags:
      - Autenticação
      summary: Cadastrar cliente e emitir token
      operationId: post_api_register
      description: Público. Sempre cria role customer. Campos extras como role não são usados. guest_cart_token
        validado não é consumido pelo AuthService.
      security: []
      responses:
        '201':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
        '422':
          $ref: '#/components/responses/Error422'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInput'
  /api/login:
    post:
      tags:
      - Autenticação
      summary: Autenticar e emitir token
      operationId: post_api_login
      description: 'Público. X-Guest-Cart-Token opcional mescla o carrinho visitante ao carrinho ativo do usuário
        antes de emitir o token. Soma quantidades; valida produto ativo, estoque e limite 20. A mesclagem é transacional,
        limpa os itens e invalida o token visitante. Credenciais inválidas: 401. Token visitante malformado: 422;
        não encontrado/inativo: 404.'
      security: []
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
      parameters:
      - name: X-Guest-Cart-Token
        in: header
        required: false
        schema: &id003
          type: string
          minLength: 64
          maxLength: 64
          pattern: ^[a-zA-Z0-9]{64}$
        description: Token retornado por POST /api/guest/cart. Não é o token de autenticação do usuário.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
  /api/me:
    get:
      tags:
      - Autenticação
      summary: Consultar usuário autenticado
      operationId: get_api_me
      description: Exige auth:sanctum. Não há restrição de role nesta rota.
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                required:
                - user
        '401':
          $ref: '#/components/responses/Error401'
  /api/logout:
    post:
      tags:
      - Autenticação
      summary: Revogar token atual
      operationId: post_api_logout
      description: Exige auth:sanctum. Não há restrição de role nesta rota. Remove currentAccessToken(); outros
        tokens pessoais permanecem válidos.
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: '#/components/responses/Error401'
  /api/products:
    get:
      tags:
      - Produtos
      summary: Listar catálogo público
      operationId: get_api_products
      description: Público. Somente ativos; nome crescente; 12 por página. Estoque zero não remove o produto do
        catálogo.
      security: []
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '422':
          $ref: '#/components/responses/Error422'
      parameters:
      - &id001
        name: page
        in: query
        required: false
        schema:
          type: integer
        description: Página do paginador Laravel (tamanho fixo; não há parâmetro per_page).
      - &id002
        name: search
        in: query
        required: false
        schema:
          type: string
          maxLength: 100
          nullable: true
        description: Nome contém o texto (LIKE); espaços externos removidos.
      - name: category_id
        in: query
        required: false
        schema:
          type: integer
          nullable: true
        description: Categoria existente; ID inexistente resulta em 422.
  /api/products/{product}:
    get:
      tags:
      - Produtos
      summary: Consultar produto ativo
      operationId: get_api_products_product
      description: Público.
      security: []
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Product'
                required:
                - data
        '404':
          $ref: '#/components/responses/Error404'
      parameters:
      - name: product
        in: path
        required: true
        schema:
          type: integer
        description: ID de product.
  /api/products/{product}/image:
    get:
      tags:
      - Produtos
      summary: Obter imagem do produto
      operationId: get_api_products_product_image
      description: Público. Stream do disco public. Exige produto ativo, image_path preenchido e arquivo existente.
        Sem envelope JSON no sucesso.
      security: []
      responses:
        '200':
          description: Conteúdo binário da imagem; Content-Type determinado pelo arquivo armazenado.
          content:
            image/*:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/Error404'
      parameters:
      - name: product
        in: path
        required: true
        schema:
          type: integer
        description: ID de product.
  /api/categories:
    get:
      tags:
      - Categorias
      summary: Listar categorias
      operationId: get_api_categories
      description: Público. Nome crescente; 12 por página. Não filtra por produtos ativos.
      security: []
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryPage'
      parameters:
      - *id001
  /api/categories/{category}:
    get:
      tags:
      - Categorias
      summary: Consultar categoria
      operationId: get_api_categories_category
      description: Público.
      security: []
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Category'
                required:
                - data
        '404':
          $ref: '#/components/responses/Error404'
      parameters:
      - name: category
        in: path
        required: true
        schema:
          type: integer
        description: ID de category.
  /api/admin/products:
    get:
      tags:
      - Administração de produtos
      summary: Listar produtos ativos e inativos
      operationId: get_api_admin_products
      description: 'Exige auth:sanctum e EnsureUserIsAdmin (User::isAdmin(): role === ''admin''). ID decrescente;
        15 por página; status omitido assume all.'
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '422':
          $ref: '#/components/responses/Error422'
      parameters:
      - *id001
      - *id002
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - all
          - active
          - inactive
          nullable: true
          default: all
    post:
      tags:
      - Administração de produtos
      summary: Criar produto
      operationId: post_api_admin_products
      description: 'Exige auth:sanctum e EnsureUserIsAdmin (User::isAdmin(): role === ''admin''). Registra movimentação
        de estoque inicial quando stock > 0. is_active omitido usa o padrão true do banco.'
      security:
      - BearerAuth: []
      responses:
        '201':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Product'
                required:
                - data
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '422':
          $ref: '#/components/responses/Error422'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreate'
  /api/admin/products/{product}:
    put:
      tags:
      - Administração de produtos
      summary: Atualizar produto
      operationId: put_api_admin_products_product
      description: 'Exige auth:sanctum e EnsureUserIsAdmin (User::isAdmin(): role === ''admin''). Atualização parcial;
        alterações de estoque registram movimentação administrativa, com bloqueio e transação.'
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Product'
                required:
                - data
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
      parameters:
      - name: product
        in: path
        required: true
        schema:
          type: integer
        description: ID de product.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdate'
    patch:
      tags:
      - Administração de produtos
      summary: Atualizar produto
      operationId: patch_api_admin_products_product
      description: 'Exige auth:sanctum e EnsureUserIsAdmin (User::isAdmin(): role === ''admin''). Atualização parcial;
        alterações de estoque registram movimentação administrativa, com bloqueio e transação.'
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Product'
                required:
                - data
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
      parameters:
      - name: product
        in: path
        required: true
        schema:
          type: integer
        description: ID de product.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdate'
    delete:
      tags:
      - Administração de produtos
      summary: Desativar produto
      operationId: delete_api_admin_products_product
      description: 'Exige auth:sanctum e EnsureUserIsAdmin (User::isAdmin(): role === ''admin''). Define is_active=false.
        Não exclui fisicamente nem modifica estoque.'
      security:
      - BearerAuth: []
      responses:
        '204':
          description: Sucesso, sem corpo.
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
      parameters:
      - name: product
        in: path
        required: true
        schema:
          type: integer
        description: ID de product.
  /api/admin/products/{product}/stock-movements:
    get:
      tags:
      - Estoque
      summary: Consultar movimentações do produto
      operationId: get_api_admin_products_product_stock_movements
      description: 'Exige auth:sanctum e EnsureUserIsAdmin (User::isAdmin(): role === ''admin''). ID decrescente;
        20 por página. Inclui actor_user_id, order_id e reason anuláveis.'
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockMovementPage'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
      parameters:
      - name: product
        in: path
        required: true
        schema:
          type: integer
        description: ID de product.
      - *id001
  /api/admin/categories:
    post:
      tags:
      - Administração de categorias
      summary: Criar categoria
      operationId: post_api_admin_categories
      description: 'Exige auth:sanctum e EnsureUserIsAdmin (User::isAdmin(): role === ''admin'').'
      security:
      - BearerAuth: []
      responses:
        '201':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Category'
                required:
                - data
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '422':
          $ref: '#/components/responses/Error422'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryCreate'
  /api/admin/categories/{category}:
    put:
      tags:
      - Administração de categorias
      summary: Atualizar categoria
      operationId: put_api_admin_categories_category
      description: 'Exige auth:sanctum e EnsureUserIsAdmin (User::isAdmin(): role === ''admin''). Atualização parcial
        em PUT e PATCH.'
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Category'
                required:
                - data
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
      parameters:
      - name: category
        in: path
        required: true
        schema:
          type: integer
        description: ID de category.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryUpdate'
    patch:
      tags:
      - Administração de categorias
      summary: Atualizar categoria
      operationId: patch_api_admin_categories_category
      description: 'Exige auth:sanctum e EnsureUserIsAdmin (User::isAdmin(): role === ''admin''). Atualização parcial
        em PUT e PATCH.'
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Category'
                required:
                - data
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
      parameters:
      - name: category
        in: path
        required: true
        schema:
          type: integer
        description: ID de category.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryUpdate'
    delete:
      tags:
      - Administração de categorias
      summary: Excluir categoria sem produtos
      operationId: delete_api_admin_categories_category
      description: 'Exige auth:sanctum e EnsureUserIsAdmin (User::isAdmin(): role === ''admin''). 409 se houver
        qualquer produto associado, inclusive inativo; caso contrário exclui fisicamente.'
      security:
      - BearerAuth: []
      responses:
        '204':
          description: Sucesso, sem corpo.
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
      parameters:
      - name: category
        in: path
        required: true
        schema:
          type: integer
        description: ID de category.
  /api/guest/cart:
    post:
      tags:
      - Carrinho visitante
      summary: Criar carrinho visitante
      operationId: post_api_guest_cart
      description: 'Público. 10 requisições por minuto; Cache-Control: no-store. Token aleatório de 64 caracteres,
        armazenado somente como hash. Resposta sem envelope data.'
      security: []
      responses:
        '201':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  cart:
                    $ref: '#/components/schemas/Cart'
                  guest_cart_token:
                    type: string
                    minLength: 64
                    maxLength: 64
                required:
                - cart
                - guest_cart_token
        '429':
          $ref: '#/components/responses/Error429'
    get:
      tags:
      - Carrinho visitante
      summary: Consultar carrinho visitante
      operationId: get_api_guest_cart
      description: 'Público. 60 por minuto; Cache-Control: no-store. Token deve identificar carrinho ativo sem usuário.'
      security: []
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Cart'
                required:
                - data
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
      parameters:
      - &id004
        name: X-Guest-Cart-Token
        in: header
        required: true
        schema: *id003
        description: Token retornado por POST /api/guest/cart. Não é o token de autenticação do usuário.
  /api/cart:
    get:
      tags:
      - Carrinho autenticado
      summary: Consultar ou criar carrinho ativo
      operationId: get_api_cart
      description: Exige auth:sanctum. Não há restrição de role nesta rota. Cria um carrinho ativo quando necessário,
        mesmo sendo GET; carrega itens, produtos e categorias. Não há paginação.
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Cart'
                required:
                - data
        '401':
          $ref: '#/components/responses/Error401'
  /api/cart/items:
    post:
      tags:
      - Carrinho autenticado
      summary: Adicionar unidades de produto ao carrinho
      operationId: post_api_cart_items
      description: Exige auth:sanctum. Não há restrição de role nesta rota. Opera no carrinho ativo do usuário;
        cria esse carrinho se ainda não existir. Se o produto já existir, soma quantidades. Valida quantidade acumulada
        ≤20, produto ativo e estoque. Retorna o carrinho completo com status 200.
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Cart'
                required:
                - data
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartItemInput'
  /api/cart/items/{item}:
    patch:
      tags:
      - Carrinho autenticado
      summary: Substituir quantidade do item
      operationId: patch_api_cart_items_item
      description: Exige auth:sanctum. Não há restrição de role nesta rota. Opera no carrinho ativo do usuário;
        cria esse carrinho se ainda não existir. Exige que o item pertença a este carrinho. Produto deve estar ativo,
        com estoque suficiente e quantidade entre 1 e 20.
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Cart'
                required:
                - data
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
      parameters:
      - name: item
        in: path
        required: true
        schema:
          type: integer
        description: ID de item.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuantityInput'
    delete:
      tags:
      - Carrinho autenticado
      summary: Remover item do carrinho
      operationId: delete_api_cart_items_item
      description: Exige auth:sanctum. Não há restrição de role nesta rota. Opera no carrinho ativo do usuário;
        cria esse carrinho se ainda não existir. Exige que o item pertença a este carrinho. Retorna carrinho completo,
        status 200, sem reservar nem devolver estoque.
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object

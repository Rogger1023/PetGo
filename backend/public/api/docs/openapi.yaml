  /api/orders/{order}/cancel:
    post:
      tags:
      - Pedidos
      summary: Cancelar meu pedido pendente
      operationId: post_api_orders_order_cancel
      description: 'Exige auth:sanctum. Não há restrição de role nesta rota. Somente do usuário, pending_payment
        e pagamento pending sem paid_at. Devolve estoque dos produtos existentes, cancela pagamento/pedido e registra
        históricos/movimentos, em transação. Repetir pedido já cancelled é idempotente. Outros estados ou pagamento
        incompatível: 409.'
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Order'
                required:
                - data
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
      parameters:
      - name: order
        in: path
        required: true
        schema:
          type: integer
        description: ID de order.
  /api/admin/orders/{order}/confirm-payment:
    post:
      tags:
      - Administração de pedidos
      summary: Confirmar pagamento simulado
      operationId: post_api_admin_orders_order_confirm_payment
      description: 'Exige auth:sanctum e EnsureUserIsAdmin (User::isAdmin(): role === ''admin''). Exige pending_payment
        e pagamento pending sem paid_at. Marca pagamento paid e pedido processing; registra histórico. Repetir processing/paid
        já confirmado retorna 200 sem duplicar efeitos; outros estados ou pagamento ausente: 409. Sem integração
        com provedor externo.'
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AdminOrder'
                required:
                - data
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
      parameters:
      - name: order
        in: path
        required: true
        schema:
          type: integer
        description: ID de order.
  /api/admin/orders/{order}/status:
    patch:
      tags:
      - Administração de pedidos
      summary: Avançar entrega do pedido
      operationId: patch_api_admin_orders_order_status
      description: 'Exige auth:sanctum e EnsureUserIsAdmin (User::isAdmin(): role === ''admin''). Exige pagamento
        paid com paid_at. Transições processing → shipped → delivered; repetição do mesmo destino é idempotente
        após validar pagamento. Pagamento incompatível ou salto/retorno de estado: 409. Registra histórico, sem
        alterar estoque.'
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AdminOrder'
                required:
                - data
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
      parameters:
      - name: order
        in: path
        required: true
        schema:
          type: integer
        description: ID de order.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum:
                  - shipped
                  - delivered
              required:
              - status
  /sanctum/csrf-cookie:
    get:
      tags:
      - Infraestrutura Sanctum
      summary: Inicializar cookies CSRF do Sanctum
      operationId: get_sanctum_csrf_cookie
      description: 'Público. Rota web de infraestrutura do Sanctum: emite cookies de sessão/XSRF. Não faz login
        e não substitui Bearer nesta API. bootstrap/app.php não habilita statefulApi(); AuthService emite tokens
        pessoais, não inicia sessão de login. Não é pré-requisito para as operações /api documentadas.'
      security: []
      responses:
        '204':
          description: Sucesso, sem corpo.
          headers:
            Set-Cookie:
              description: Cookies de sessão e XSRF-TOKEN, conforme a configuração de sessão.
              schema:
                type: string
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Token pessoal Sanctum emitido por login/cadastro; informe somente o token, sem o prefixo Bearer.
  schemas:
    Message:
      type: object
      properties:
        message:
          type: string
      description: Erros Laravel podem incluir campos de diagnóstico adicionais quando APP_DEBUG=true.
      required:
      - message
    ValidationError:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      required:
      - message
      - errors
    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
      required:
      - id
      - name
      - email
      - role
    AuthResult:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        token:
          type: string
          description: Token pessoal Sanctum. Copie o valor para Authorize (sem o prefixo Bearer).
      required:
      - user
      - token
    Category:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        description:
          type: string
          nullable: true
      required:
      - id
      - name
      - slug
      - description
    Product:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        description:
          type: string
          nullable: true
        image_path:
          type: string
          nullable: true
        image_url:
          type: string
          nullable: true
          description: Caminho relativo /api/products/{id}/image, ou null. Produto inativo pode ter URL, mas a imagem
            retorna 404.
        price_cents:
          type: integer
        stock:
          type: integer
        in_stock:
          type: boolean
        category:
          $ref: '#/components/schemas/Category'
        category_id:
          type: integer
        is_active:
          type: boolean
      description: category só é incluída quando carregada. Nas operações documentadas de catálogo e carrinho, ela
        é carregada.
      required:
      - id
      - name
      - slug
      - description
      - image_path
      - image_url
      - price_cents
      - stock
      - in_stock
      - category_id
      - is_active
    CartItem:
      type: object
      properties:
        id:
          type: integer
        product_id:
          type: integer
        quantity:
          type: integer
        product:
          $ref: '#/components/schemas/Product'
      required:
      - id
      - product_id
      - quantity
      - product
    Cart:
      type: object
      properties:
        id:
          type: integer
        status:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
        created_at:
          type: string
          format: date-time
      required:
      - id
      - status
      - items
      - created_at
    AddressInput:
      type: object
      properties:
        recipient_name: &id005
          type: string
          maxLength: 120
        phone: &id006
          type: string
          minLength: 8
          maxLength: 20
        postal_code: &id007
          type: string
          pattern: ^[0-9]{5}-?[0-9]{3}$
        street: &id008
          type: string
          maxLength: 180
        number: &id009
          type: string
          maxLength: 20
        complement: &id010
          type: string
          nullable: true
          maxLength: 120
        neighborhood: &id011
          type: string
          maxLength: 100
        city: &id012
          type: string
          maxLength: 100
        state: &id013
          type: string
          minLength: 2
          maxLength: 2
          pattern: ^[A-Z]{2}$
        reference: &id014
          type: string
          nullable: true
          maxLength: 255
        is_default: &id015
          type: boolean
      description: PUT exige os mesmos campos obrigatórios do POST. CEP aceita 8 dígitos com ou sem hífen; UF deve
        estar em maiúsculas.
      required:
      - recipient_name
      - phone
      - postal_code
      - street
      - number
      - neighborhood
      - city
      - state
    Address:
      type: object
      properties:
        id:
          type: integer
        recipient_name: *id005
        phone: *id006
        postal_code: *id007
        street: *id008
        number: *id009
        complement: *id010
        neighborhood: *id011
        city: *id012
        state: *id013
        reference: *id014
        is_default: *id015
      description: Não inclui user_id nem timestamps.
      required:
      - id
      - recipient_name
      - phone
      - postal_code
      - street
      - number
      - complement
      - neighborhood
      - city
      - state
      - reference
      - is_default
    AddressSnapshot:
      type: object
      properties:
        recipient_name: *id005
        phone: *id006
        postal_code: *id007
        street: *id008
        number: *id009
        complement: *id010
        neighborhood: *id011
        city: *id012

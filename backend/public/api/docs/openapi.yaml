  /api/checkout:
    post:
      tags:
      - Checkout
      summary: Processar pedido a partir do carrinho
      operationId: post_api_checkout
      description: 'Exige auth:sanctum. Não há restrição de role nesta rota. 10 por minuto. Recalcula preços no
        servidor; frete 0; exige carrinho não vazio, produtos ativos, estoque e limite 20 por produto. Transação
        com bloqueios: cria pedido pending_payment, snapshot, itens, pagamento pending, histórico e movimentos;
        desconta estoque e marca carrinho checked_out. Mesma checkout_key do mesmo usuário retorna pedido existente,
        ainda 201, sem repetir efeitos; chave de outro usuário: 409. Endereço de outro usuário: 422 na validação.
        Resposta {message, order}, sem data externo.'
      security:
      - BearerAuth: []
      responses:
        '201':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  order:
                    $ref: '#/components/schemas/Order'
                required:
                - message
                - order
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutInput'

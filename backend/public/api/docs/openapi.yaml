    CategoryCreate:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
          description: Único em categories.name.
        slug:
          type: string
          maxLength: 140
          description: Único em categories.slug; alpha_dash do Laravel (letras/números Unicode, hífen e underscore).
        description:
          type: string
          nullable: true
      required:
      - name
      - slug
    CategoryUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
          description: Único em categories.name.
        slug:
          type: string
          maxLength: 140
          description: Único em categories.slug; alpha_dash do Laravel (letras/números Unicode, hífen e underscore).
        description:
          type: string
          nullable: true
      description: Campos opcionais; name e slug, quando enviados, não podem ser vazios. Unicidade ignora a própria
        categoria.
    ProductCreate:
      type: object
      properties:
        category_id:
          type: integer
          description: Deve existir em categories.id.
        name:
          type: string
          maxLength: 180
        slug:
          type: string
          maxLength: 220
          description: Único em products.slug; alpha_dash do Laravel.
        description:
          type: string
          nullable: true
        image_path:
          type: string
          nullable: true
          maxLength: 255
          description: Caminho de arquivo já existente no disco public. Esta operação não recebe upload.
        price_cents:
          type: integer
          minimum: 0
        stock:
          type: integer
          minimum: 0
        is_active:
          type: boolean
      required:
      - category_id
      - name
      - slug
      - price_cents
      - stock
    ProductUpdate:
      type: object
      properties:
        category_id:
          type: integer
          description: Deve existir em categories.id.
        name:
          type: string
          maxLength: 180
        slug:
          type: string
          maxLength: 220
          description: Único em products.slug; alpha_dash do Laravel.
        description:
          type: string
          nullable: true
        image_path:
          type: string
          nullable: true
          maxLength: 255
          description: Caminho de arquivo já existente no disco public. Esta operação não recebe upload.
        price_cents:
          type: integer
          minimum: 0
        stock:
          type: integer
          minimum: 0
        is_active:
          type: boolean
      description: PUT e PATCH aceitam atualização parcial. Campos não anuláveis não podem ser vazios quando enviados.
        Unicidade do slug ignora o próprio produto.
    CartItemInput:
      type: object
      properties:
        product_id:
          type: integer
          description: Deve existir em products.id e estar ativo.
        quantity:
          type: integer
          minimum: 1
          maximum: 20
      required:
      - product_id
      - quantity
    QuantityInput:
      type: object
      properties:
        quantity:
          type: integer
          minimum: 1
          maximum: 20
      description: O serviço aplica limite de 20 e valida estoque, inclusive no PATCH.
      required:
      - quantity
    RegisterInput:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
          maxLength: 255
          description: Único em users.email.
        password:
          type: string
          format: password
          minLength: 8
        password_confirmation:
          type: string
          format: password
          description: Deve coincidir com password.
        guest_cart_token:
          type: string
          nullable: true
          maxLength: 255
          description: Validado, mas ignorado pelo serviço de cadastro; não mescla carrinhos.
      required:
      - name
      - email
      - password
      - password_confirmation
    LoginInput:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          format: password
      required:
      - email
      - password
    CheckoutInput:
      type: object
      properties:
        address_id:
          type: integer
          description: Deve existir e pertencer ao usuário autenticado.
        checkout_key:
          type: string
          format: uuid
          maxLength: 64
      required:
      - address_id
      - checkout_key
  responses:
    Error401:
      description: Não autenticado, credenciais inválidas ou token de visitante ausente (conforme a operação).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
    Error403:
      description: Acesso restrito a administradores.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
    Error404:
      description: Recurso não encontrado ou não pertence ao usuário/carrinho atual.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
    Error409:
      description: Conflito com o estado atual do recurso; veja as regras da operação.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
    Error422:
      description: Falha de validação dos campos ou das regras de negócio descritas na operação.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
    Error429:
      description: Limite de requisições excedido. Consulte Retry-After.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
